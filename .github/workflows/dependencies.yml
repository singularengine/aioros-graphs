name: dependencies

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 3"

jobs:
  advisories:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: sdk
        run: dotnet --version > /dev/null 2>&1 || eng/install-sdk.sh
      - name: tools
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q > /dev/null
          apt-get install -y -q python3 > /dev/null
      - name: Restore
        run: dotnet restore Aioros.Graphs.slnx
      - name: Security releases and package advisories
        run: python3 -I eng/check-dependencies.py
